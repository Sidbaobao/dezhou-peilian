<style>
/* Hallmark · custom theme "牌室" · tone: playful-utilitarian · anchor hue: 160 (绒布绿) · accent: 金 oklch(80% 0.13 85)
 * axes: paper dark / display grotesk-sans (Bricolage Grotesque) / accent warm
 * layout: one-screen app, three bands (flow strip / felt oval with seats on the rail / hero cards + action bar)
 * Hallmark · pre-emit critique: P4 H4 E4 S5 R4 V4
 */
:root {
  color-scheme: dark;

  /* 色彩 */
  --color-paper: oklch(17% 0.02 160);
  --color-paper-2: oklch(21% 0.022 160);
  --color-paper-3: oklch(26% 0.024 160);
  --color-paper-4: oklch(31% 0.026 160);
  --color-rule: oklch(34% 0.02 160);
  --color-ink: oklch(94% 0.012 90);
  --color-muted: oklch(72% 0.015 150);
  --color-neutral: oklch(56% 0.015 150);
  --color-accent: oklch(80% 0.13 85);
  --color-accent-ink: oklch(22% 0.05 85);
  --color-focus: oklch(86% 0.14 85);

  --color-felt: oklch(39% 0.085 160);
  --color-felt-deep: oklch(32% 0.08 160);
  --color-rail: oklch(27% 0.045 60);
  --color-rail-edge: oklch(36% 0.05 60);

  --color-card: oklch(97% 0.012 85);
  --color-card-shade: oklch(90% 0.014 85);
  --color-card-ink: oklch(22% 0.03 250);
  --color-card-red: oklch(50% 0.2 25);
  --color-card-blue: oklch(48% 0.17 255);
  --color-card-green: oklch(48% 0.14 150);
  --color-card-back: oklch(42% 0.1 25);
  --color-card-back-2: oklch(30% 0.09 25);

  --color-good: oklch(74% 0.15 150);
  --color-warn: oklch(80% 0.14 70);
  --color-bad: oklch(66% 0.18 25);

  --chip-5: oklch(55% 0.18 25);
  --chip-25: oklch(50% 0.13 150);
  --chip-100: oklch(28% 0.02 250);
  --chip-500: oklch(50% 0.17 300);
  --chip-1000: oklch(78% 0.13 85);
  --chip-edge: oklch(96% 0.01 85);

  /* 字体 */
  --font-display: "Bricolage Grotesque", "Avenir Next Condensed", "Helvetica Neue", Arial, sans-serif;
  --font-body: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", "Helvetica Neue", Arial, sans-serif;

  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-md: 1.25rem;
  --text-lg: 1.5625rem;
  --text-xl: 1.9531rem;
  --text-2xl: 2.4414rem;
  --text-display: clamp(2.4rem, 5vw + 1rem, 4.2rem);

  /* 间距 */
  --space-3xs: 0.125rem;
  --space-2xs: 0.25rem;
  --space-xs: 0.5rem;
  --space-sm: 0.75rem;
  --space-md: 1rem;
  --space-lg: 1.5rem;
  --space-xl: 2.5rem;
  --space-2xl: 4rem;

  /* 圆角 */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-pill: 999px;

  /* 动效 */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in: cubic-bezier(0.7, 0, 0.84, 0);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --dur-micro: 120ms;
  --dur-short: 220ms;
  --dur-long: 420ms;

  /* 层级 */
  --z-base: 1;
  --z-raised: 10;
  --z-dropdown: 100;
  --z-sticky: 200;
  --z-modal: 400;
  --z-toast: 500;
  --z-tooltip: 600;

  /* 牌桌尺寸 */
  --card-w: clamp(30px, 8vw, 46px);
  --hero-card-w: clamp(64px, 19vw, 100px);
  --seat-card-w: clamp(18px, 5vw, 28px);
}

/* 可解锁的桌布 */
:root[data-felt="blue"] { --color-felt: oklch(40% 0.08 240); --color-felt-deep: oklch(33% 0.08 240); }
:root[data-felt="red"] { --color-felt: oklch(40% 0.1 25); --color-felt-deep: oklch(33% 0.1 25); }
:root[data-felt="purple"] { --color-felt: oklch(38% 0.09 300); --color-felt-deep: oklch(31% 0.09 300); }

/* 可解锁的牌背 */
:root[data-back="ocean"] { --color-card-back: oklch(45% 0.1 240); --color-card-back-2: oklch(32% 0.09 240); }
:root[data-back="forest"] { --color-card-back: oklch(45% 0.1 150); --color-card-back-2: oklch(32% 0.09 150); }

/* 德州陪练 · 界面样式（令牌见 tokens.css） */

/* ---------- 基础 ---------- */
html, body { height: 100%; }
html { overflow-x: clip; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  overflow-x: clip;
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
*, *::before, *::after { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
[hidden] { display: none !important; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

#app { height: 100%; display: flex; flex-direction: column; }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* 进场：一次编排的入场，之后页面静止 */
.enter { animation: enter var(--dur-long) var(--ease-out) both; animation-delay: calc(var(--i, 0) * 70ms); }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } }

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-xs);
  min-height: 44px; padding: 0 var(--space-md);
  border-radius: var(--radius-md);
  background: var(--color-paper-3);
  color: var(--color-ink);
  font-weight: 600; white-space: nowrap;
  border: 1px solid transparent;
  transition: background-color var(--dur-short) var(--ease-out), transform 100ms var(--ease-out), border-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out);
}
.btn:hover { background: var(--color-paper-4); }
.btn:active { transform: translateY(1px) scale(0.99); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--color-accent); color: var(--color-accent-ink); }
.btn-primary:hover { background: var(--color-focus); transform: translateY(-1px); }
.btn-primary:active { transform: translateY(1px) scale(0.99); }
.btn-outline { background: transparent; border-color: var(--color-accent); color: var(--color-accent); }
.btn-outline:hover { background: oklch(80% 0.13 85 / 0.12); }
.btn-ghost { background: transparent; color: var(--color-muted); border-color: var(--color-rule); }
.btn-ghost:hover { background: var(--color-paper-2); color: var(--color-ink); }
.btn-danger { background: transparent; border-color: var(--color-rule); color: var(--color-bad); }
.btn-danger:hover { background: oklch(66% 0.18 25 / 0.12); }
.btn-lg { min-height: 52px; padding: 0 var(--space-lg); font-size: var(--text-md); }
.btn-xl { min-height: 58px; padding: 0 var(--space-lg); font-size: var(--text-md); border-radius: var(--radius-lg); width: 100%; }
.btn-sm { min-height: 34px; padding: 0 var(--space-sm); font-size: var(--text-sm); border-radius: var(--radius-sm); }
.btn-icon { width: 40px; min-height: 40px; padding: 0; border-radius: var(--radius-md); color: var(--color-muted); }
.btn-icon:hover { color: var(--color-ink); background: var(--color-paper-2); }
.btn-icon svg { width: 22px; height: 22px; }
.icon { width: 1.1em; height: 1.1em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
kbd { font-family: var(--font-display); font-size: 10px; font-weight: 700; line-height: 1; padding: 2px 5px; border-radius: 4px; border: 1px solid currentColor; opacity: 0.55; }

/* 分段选择 */
.seg { display: inline-flex; align-items: center; background: var(--color-paper-2); border-radius: var(--radius-md); padding: 3px; gap: 2px; }
.seg button { min-height: 36px; min-width: 44px; padding: 0 var(--space-sm); border-radius: var(--radius-sm); color: var(--color-muted); font-weight: 600; transition: background-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out); }
.seg button[aria-pressed="true"] { background: var(--color-paper-4); color: var(--color-ink); }
.seg button:hover { color: var(--color-ink); }
.seg-sm { padding: 2px; }
.seg-sm button { min-height: 32px; min-width: 34px; padding: 0 8px; font-size: var(--text-sm); }
.seg-label { padding: 0 6px 0 10px; font-size: var(--text-sm); color: var(--color-muted); }

/* 开关 */
.switch { display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); min-height: 44px; width: 100%; text-align: left; }
.switch-label { display: flex; flex-direction: column; gap: 2px; }
.switch-label small { color: var(--color-muted); font-size: var(--text-sm); }
.switch-track { flex: none; width: 46px; height: 28px; border-radius: var(--radius-pill); background: var(--color-paper-4); position: relative; transition: background-color var(--dur-short) var(--ease-out); }
.switch-track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--color-ink); transition: transform var(--dur-short) var(--ease-out); }
.switch[aria-checked="true"] .switch-track { background: var(--color-accent); }
.switch[aria-checked="true"] .switch-track::after { transform: translateX(18px); background: var(--color-accent-ink); }
.chip-toggle {
  display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 12px 0 10px;
  border-radius: var(--radius-pill); border: 1px solid var(--color-rule); color: var(--color-muted);
  font-size: var(--text-sm); font-weight: 600; white-space: nowrap;
  transition: border-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out), background-color var(--dur-short) var(--ease-out);
}
.chip-toggle .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-neutral); transition: background-color var(--dur-short) var(--ease-out), box-shadow var(--dur-short) var(--ease-out); }
.chip-toggle:hover { background: var(--color-paper-2); color: var(--color-ink); }
.chip-toggle[aria-checked="true"] { border-color: var(--color-accent); color: var(--color-ink); }
.chip-toggle[aria-checked="true"] .dot { background: var(--color-accent); box-shadow: 0 0 0 3px oklch(80% 0.13 85 / 0.2); }

/* ---------- 大厅 ---------- */
#lobby { overflow-y: auto; overflow-x: hidden; padding-inline: max(var(--space-md), env(safe-area-inset-left), env(safe-area-inset-right)); }
.lobby-inner { width: 100%; max-width: 60rem; margin-inline: auto; padding-block: var(--space-sm) var(--space-2xl); display: flex; flex-direction: column; gap: var(--space-xl); }

.masthead { display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); min-height: 48px; }
.wordmark { display: flex; align-items: baseline; gap: var(--space-xs); min-width: 0; }
.wordmark-cn { font-size: var(--text-md); font-weight: 800; letter-spacing: 0.04em; white-space: nowrap; }
.wordmark-en { font-family: var(--font-display); font-size: var(--text-xs); font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-accent); white-space: nowrap; }
.level-pill { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 10px 0 8px; border-radius: var(--radius-pill); border: 1px solid var(--color-rule); color: var(--color-muted); font-size: var(--text-sm); white-space: nowrap; flex: none; transition: border-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out); }
@media (max-width: 22.5rem) { .wordmark-en { display: none; } }
.level-pill:hover { border-color: var(--color-accent); color: var(--color-ink); }
.level-pill-no { font-family: var(--font-display); font-weight: 700; color: var(--color-ink); letter-spacing: 0.02em; }

.hero { display: grid; gap: var(--space-lg); grid-template-areas: "text" "stage" "cta"; }
.hero-text { grid-area: text; display: flex; flex-direction: column; gap: var(--space-sm); }
.headline { margin: 0; font-size: clamp(1.8rem, 8.6vw, 3.4rem); line-height: 1.14; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.lede { margin: 0; color: var(--color-muted); font-size: var(--text-base); line-height: 1.65; max-width: 26em; }

.stage { grid-area: stage; position: relative; height: 188px; }
@media (max-width: 60rem) {
  /* 手机上让绒布一直延伸到屏幕边缘，并在那里裁掉，不产生横向滚动 */
  .stage { margin-inline: calc(-1 * max(var(--space-md), env(safe-area-inset-left), env(safe-area-inset-right))); overflow: hidden; }
}
.stage-felt {
  position: absolute; left: -22%; right: -22%; top: 26px; bottom: 0; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 32%, var(--color-felt) 0%, var(--color-felt-deep) 82%);
  box-shadow: 0 0 0 8px var(--color-rail), 0 0 0 9px var(--color-rail-edge), 0 18px 40px oklch(8% 0.03 160 / 0.6), inset 0 0 40px oklch(20% 0.05 160 / 0.5);
}
.stage-felt::after { content: ""; position: absolute; inset: 16% 22%; border-radius: 50%; border: 1px solid oklch(60% 0.08 160 / 0.25); }
.stage-cards { position: absolute; left: 50%; top: 16px; width: 0; height: 0; }
.stage-cards .card { position: absolute; left: 0; top: 0; width: 78px; transform-origin: 50% 100%; box-shadow: 0 14px 28px oklch(8% 0.03 160 / 0.55), 0 2px 4px oklch(10% 0 0 / 0.4); }
.stage-cards .card:nth-child(1) { transform: translate(-84px, 12px) rotate(-14deg); }
.stage-cards .card:nth-child(2) { transform: translate(-30px, 0) rotate(5deg); }
.stage-btn {
  position: absolute; left: calc(50% + 76px); top: 112px; width: 26px; height: 26px; border-radius: 50%;
  background: var(--color-card); color: var(--color-card-ink); font-family: var(--font-display); font-weight: 800; font-size: 13px;
  display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 4px oklch(10% 0 0 / 0.5);
}
.stage-chip { position: absolute; width: 22px; height: 22px; border-radius: 50%; border: 2px dashed var(--chip-edge); box-shadow: inset 0 0 0 2px oklch(100% 0 0 / 0.25), 0 2px 3px oklch(10% 0 0 / 0.5); }
.stage-chip-a { left: calc(50% - 150px); top: 104px; background: var(--chip-25); }
.stage-chip-b { left: calc(50% - 136px); top: 97px; background: var(--chip-100); }

.hero-cta { grid-area: cta; display: flex; flex-direction: column; gap: var(--space-md); }
.bank-row { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-2xs); }
@media (min-width: 40rem) { .bank-row { flex-direction: row; align-items: flex-end; justify-content: space-between; gap: var(--space-md); } }
.bank-label { color: var(--color-muted); font-size: var(--text-sm); margin: 0 0 2px; }
.bank-amount { font-size: clamp(2.5rem, 10vw, 3.6rem); font-weight: 700; line-height: 1; margin: 0; }
.bank-last { margin: 0; color: var(--color-muted); font-size: var(--text-sm); line-height: 1.5; max-width: 15em; }
.bank-last strong { color: var(--color-ink); font-weight: 600; }
.table-setup { display: flex; flex-wrap: wrap; gap: var(--space-xs); align-items: center; }
.start-note { color: var(--color-muted); font-size: var(--text-sm); margin: 0; }

.today { display: flex; flex-direction: column; gap: var(--space-sm); padding-top: var(--space-lg); border-top: 1px solid var(--color-rule); }
.today-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-sm); }
.today-head h2 { margin: 0; font-size: var(--text-md); font-weight: 700; }
.today-signin { color: var(--color-good); font-size: var(--text-sm); }
.missions { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-xs); }
.mission { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "text reward" "bar progress"; gap: 6px var(--space-sm); align-items: center; padding: var(--space-sm) var(--space-md); border-radius: var(--radius-md); background: var(--color-paper-2); }
.mission-text { grid-area: text; font-size: var(--text-sm); font-weight: 600; }
.mission-reward { grid-area: reward; font-weight: 700; color: var(--color-accent); font-size: var(--text-sm); white-space: nowrap; }
.mission .bar { grid-area: bar; height: 4px; }
.mission-progress { grid-area: progress; font-size: var(--text-xs); color: var(--color-muted); white-space: nowrap; }
.mission.done { opacity: 0.6; }
.mission.done .mission-reward { color: var(--color-good); }

.progress { display: flex; flex-direction: column; gap: var(--space-xs); padding-top: var(--space-lg); border-top: 1px solid var(--color-rule); }
.level-row { display: flex; justify-content: space-between; gap: var(--space-sm); font-size: var(--text-sm); color: var(--color-muted); }
.level-row strong { color: var(--color-ink); }
.bar { height: 6px; background: var(--color-paper-3); border-radius: var(--radius-pill); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--color-accent); border-radius: var(--radius-pill); transition: transform var(--dur-long) var(--ease-out); transform-origin: left; }

.lobby-links { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-xs); }

@media (min-width: 60rem) {
  .lobby-inner { padding-block: var(--space-md) var(--space-2xl); gap: var(--space-2xl); }
  .hero { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "text stage" "cta stage"; column-gap: var(--space-2xl); row-gap: var(--space-xl); align-items: center; }
  .headline { font-size: clamp(2.6rem, 4vw, 3.4rem); }
  .stage { height: 320px; }
  .stage-felt { left: -4%; right: -4%; top: 40px; }
  .stage-cards { top: 28px; }
  .stage-cards .card { width: 118px; }
  .stage-cards .card:nth-child(1) { transform: translate(-126px, 18px) rotate(-14deg); }
  .stage-cards .card:nth-child(2) { transform: translate(-44px, 0) rotate(5deg); }
  .stage-btn { left: calc(50% + 112px); top: 200px; width: 32px; height: 32px; font-size: 15px; }
  .stage-chip { width: 28px; height: 28px; }
  .stage-chip-a { left: calc(50% - 210px); top: 180px; }
  .stage-chip-b { left: calc(50% - 192px); top: 170px; }
  .lobby-links { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .today, .progress { max-width: 36rem; }
}

/* ---------- 牌桌 ---------- */
#table { background: var(--color-paper); }
.topbar {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--space-xs);
  padding: var(--space-2xs) max(var(--space-xs), env(safe-area-inset-left)) var(--space-2xs) max(var(--space-xs), env(safe-area-inset-right));
  min-height: 48px;
}
.topbar-right { display: flex; gap: 2px; }
.flow { min-width: 0; text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 1px; padding: var(--space-2xs) var(--space-xs); border-radius: var(--radius-md); }
.flow:hover { background: var(--color-paper-2); }
.flow-line { display: flex; align-items: center; gap: var(--space-xs); min-width: 0; font-size: var(--text-sm); }
.flow-street { flex: none; font-size: var(--text-xs); font-weight: 700; color: var(--color-accent); border: 1px solid var(--color-accent); border-radius: var(--radius-sm); padding: 0 6px; line-height: 1.5; }
.flow-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 40rem) { .flow-text { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.25; } }
.flow-why { font-size: var(--text-xs); color: var(--color-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flow.open .flow-text, .flow.open .flow-why { white-space: normal; display: block; }

.table-wrap { position: relative; flex: 1; min-height: 0; margin: 0 auto; width: 100%; max-width: 1100px; }
.felt {
  position: absolute; inset: 36px 42px;
  border-radius: 50% / 50%;
  background: radial-gradient(ellipse at 50% 38%, var(--color-felt) 0%, var(--color-felt-deep) 85%);
  box-shadow: 0 0 0 10px var(--color-rail), 0 0 0 11px var(--color-rail-edge), 0 20px 50px oklch(8% 0.03 160 / 0.55), inset 0 0 44px oklch(20% 0.05 160 / 0.5);
}
.felt::after { content: ""; position: absolute; inset: 14%; border-radius: 50%; border: 1px solid oklch(60% 0.08 160 / 0.25); }
@media (min-width: 40rem) { .felt { inset: 44px 62px; } }

.board-area { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: var(--space-xs); z-index: var(--z-base); }
.tracker { display: flex; gap: 3px; list-style: none; margin: 0; padding: 0; }
.tracker li { font-size: 10px; letter-spacing: 0.04em; color: oklch(75% 0.04 160 / 0.6); padding: 1px 6px; border-radius: var(--radius-pill); border: 1px solid transparent; white-space: nowrap; transition: color var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out); }
.tracker li.done { color: oklch(85% 0.05 160 / 0.75); }
.tracker li.done::before { content: "✓ "; }
.tracker li.current { color: var(--color-accent); border-color: var(--color-accent); }
.board { display: flex; gap: clamp(3px, 1vw, 6px); min-height: calc(var(--card-w) * 1.4); }
.board .card { width: var(--card-w); }
.pot { display: flex; align-items: center; gap: var(--space-xs); padding: 2px 10px; border-radius: var(--radius-pill); background: oklch(20% 0.04 160 / 0.55); color: var(--color-ink); font-size: var(--text-xs); white-space: nowrap; }
.pot .num { font-size: var(--text-md); font-weight: 700; }

/* 座位 */
.seat {
  position: absolute; width: clamp(86px, 22vw, 120px); transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; gap: 2px; z-index: var(--z-raised);
  transition: opacity var(--dur-short) var(--ease-out);
}
.seat-cards { display: flex; height: calc(var(--seat-card-w) * 1.4); }
.seat-cards .card { width: var(--seat-card-w); }
.seat-cards .card + .card { margin-left: -6px; }
.seat-box {
  width: 100%; padding: 6px 7px 5px; border-radius: var(--radius-md);
  background: linear-gradient(180deg, var(--color-paper-3), var(--color-paper-2));
  border: 1.5px solid oklch(100% 0 0 / 0.08);
  box-shadow: 0 6px 16px oklch(8% 0.03 160 / 0.35);
  line-height: 1.15; position: relative;
  display: flex; flex-direction: column; gap: 3px;
  transition: border-color var(--dur-short) var(--ease-out), box-shadow var(--dur-short) var(--ease-out);
}
.seat-main { display: flex; align-items: center; gap: 7px; min-width: 0; }
.avatar {
  flex: none; position: relative; width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: var(--color-ink);
  background: var(--avatar-bg, var(--color-paper-4));
}
.seat.hero .avatar { background: var(--color-accent); color: var(--color-accent-ink); }
.ring { position: absolute; left: -4px; top: -4px; width: calc(100% + 8px); height: calc(100% + 8px); transform: rotate(-90deg); pointer-events: none; opacity: 0; transition: opacity var(--dur-short) var(--ease-out); }
.ring circle { fill: none; stroke-width: 3; }
.ring .track { stroke: oklch(100% 0 0 / 0.14); }
.ring .fill { stroke: var(--color-accent); stroke-dasharray: 100; stroke-dashoffset: 0; stroke-linecap: round; }
.seat.active .ring { opacity: 1; }
.seat.active .ring .fill { animation: ring-drain var(--think-ms, 2000ms) linear forwards; }
@keyframes ring-drain { to { stroke-dashoffset: 100; } }
.seat-text { min-width: 0; display: flex; flex-direction: column; }
.seat-name { font-size: var(--text-xs); color: var(--color-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat-chips { font-size: var(--text-sm); font-weight: 700; white-space: nowrap; }
.seat-status { font-size: 10px; font-weight: 700; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--color-muted); min-height: 13px; }
.seat-status.act { color: var(--color-accent); }
.seat-status.need { color: var(--color-warn); }
.seat-status.ok { color: var(--color-good); }
.seat-status.fold { color: var(--color-neutral); }
.seat-status.allin { color: var(--color-accent); }
.seat-pos {
  position: absolute; top: -9px; left: 50%; transform: translateX(-50%);
  font-size: 10px; font-weight: 700; letter-spacing: 0.04em; line-height: 1;
  padding: 2px 6px; border-radius: var(--radius-pill); background: var(--color-paper-4); color: var(--color-muted); white-space: nowrap;
}
.seat-pos.is-btn { background: var(--color-card); color: var(--color-card-ink); }
.seat-pos.is-blind { background: var(--color-paper-4); color: var(--color-ink); }
.seat.active .seat-box { border-color: var(--color-accent); box-shadow: 0 0 0 1px var(--color-accent), 0 6px 16px oklch(8% 0.03 160 / 0.35); }
.seat.hero { transform: translate(-50%, -88%); }
.seat.folded { opacity: 0.45; }
.seat.out { opacity: 0.3; }
.seat.winner .seat-box { border-color: var(--color-accent); background: linear-gradient(180deg, oklch(80% 0.13 85 / 0.24), oklch(80% 0.13 85 / 0.1)); }

/* 下注筹码 */
.bet { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 4px; z-index: var(--z-base); font-size: var(--text-xs); font-weight: 700; color: var(--color-ink); white-space: nowrap; text-shadow: 0 1px 2px oklch(10% 0 0 / 0.6); }
.chip { width: 16px; height: 16px; border-radius: 50%; background: var(--chip-color, var(--chip-25)); border: 2px dashed var(--chip-edge); box-shadow: inset 0 0 0 2px oklch(100% 0 0 / 0.2), 0 1px 0 oklch(10% 0 0 / 0.5); }
.chip-stack { position: relative; width: 16px; height: 16px; }
.chip-stack .chip { position: absolute; left: 0; }
.dealer-btn {
  position: absolute; width: 22px; height: 22px; border-radius: 50%; transform: translate(-50%, -50%);
  background: var(--color-card); color: var(--color-card-ink); font-family: var(--font-display); font-weight: 800; font-size: 12px;
  display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px oklch(10% 0 0 / 0.5); z-index: var(--z-base);
  transition: left var(--dur-long) var(--ease-out), top var(--dur-long) var(--ease-out);
}

/* 牌 */
.card {
  position: relative; aspect-ratio: 5 / 7; width: var(--card-w); flex: none; border-radius: 8%;
  background: linear-gradient(160deg, var(--color-card) 0%, var(--color-card-shade) 100%);
  color: var(--color-card-ink); box-shadow: 0 1px 2px oklch(10% 0 0 / 0.45);
  user-select: none; container-type: inline-size;
}
/* 牌面内容放在 face 里：内边距和字号都按牌自身宽度算，放进任何容器都一样 */
.card .face {
  position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 6cqw 8cqw;
  font-family: var(--font-display); font-weight: 700; line-height: 1;
}
.card .rank { font-size: 42cqw; letter-spacing: -0.04em; }
.card .suit-sm { font-size: 30cqw; margin-top: -2cqw; }
.card .suit-big { position: absolute; right: 8cqw; bottom: 4cqw; font-size: 52cqw; line-height: 1; opacity: 0.9; }
.card.red { color: var(--color-card-red); }
.four-color .card.diamond { color: var(--color-card-blue); }
.four-color .card.club { color: var(--color-card-green); }
.card.back {
  background: repeating-linear-gradient(45deg, var(--color-card-back) 0 4px, var(--color-card-back-2) 4px 8px);
  border: 3px solid var(--color-card); box-shadow: 0 1px 2px oklch(10% 0 0 / 0.45);
}
.card.back > * { display: none; }
.card.dim { opacity: 0.4; }
.card.mine { box-shadow: 0 0 0 2px oklch(80% 0.13 85 / 0.7), 0 1px 2px oklch(10% 0 0 / 0.45); }
.card.best { box-shadow: 0 0 0 2px var(--color-accent), 0 0 12px oklch(80% 0.13 85 / 0.5); }

/* 底部：手牌与动作 */
.bottom {
  position: relative;
  flex: none; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto; gap: var(--space-xs) var(--space-md);
  padding: var(--space-xs) max(var(--space-md), env(safe-area-inset-left)) max(var(--space-sm), env(safe-area-inset-bottom)) max(var(--space-md), env(safe-area-inset-right));
  background: var(--color-paper-2); border-top: 1px solid var(--color-rule);
}
.hero-cards { grid-row: 1 / 3; display: flex; gap: 6px; align-self: center; }
.hero-cards .card { width: var(--hero-card-w); box-shadow: 0 6px 14px oklch(8% 0.03 160 / 0.5); }
.hero-cards .card + .card { margin-left: -10px; transform: rotate(4deg); }
.hero-cards .card:first-child { transform: rotate(-4deg); }
.hero-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.readout { display: flex; align-items: baseline; gap: var(--space-xs); flex-wrap: wrap; }
.readout-title { font-weight: 700; font-size: var(--text-md); }
.readout-sub { color: var(--color-muted); font-size: var(--text-sm); }
.coach-chip {
  display: inline-flex; align-items: center; gap: 6px; align-self: flex-start;
  padding: 2px 10px; border-radius: var(--radius-pill); border: 1px solid var(--color-accent); color: var(--color-accent);
  font-size: var(--text-sm); font-weight: 600; min-height: 28px; animation: fade var(--dur-short) var(--ease-out);
  transition: background-color var(--dur-short) var(--ease-out);
}
.coach-chip:hover { background: oklch(80% 0.13 85 / 0.12); }
.coach-chip .icon { width: 14px; height: 14px; }

.actions { grid-column: 2; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-xs); align-items: start; }
.action { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.action .btn { width: 100%; min-height: 50px; padding: 0 var(--space-xs); flex-direction: column; gap: 1px; line-height: 1.15; }
.action .btn .lbl { display: inline-flex; align-items: center; gap: 6px; }
.action .btn kbd { display: none; }
.action .btn small { font-size: var(--text-xs); font-weight: 600; opacity: 0.85; }
.action-hint { font-size: 11px; line-height: 1.3; color: var(--color-muted); min-height: 0; text-align: left; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.waiting-note { grid-column: 2; color: var(--color-muted); font-size: var(--text-sm); min-height: 48px; display: flex; align-items: center; }
@media (max-width: 40rem) {
  .bottom { grid-template-rows: auto auto; }
  .hero-cards { grid-row: 1; }
  .actions, .waiting-note { grid-column: 1 / -1; }
  .waiting-note { min-height: 36px; }
  .action .btn { min-height: 52px; }
}
@media (hover: hover) and (pointer: fine) and (min-width: 60rem) { .action .btn kbd { display: inline-block; } }

/* 加注面板 */
.raise-panel {
  position: absolute; left: var(--space-md); right: var(--space-md); bottom: calc(100% + 4px); z-index: var(--z-dropdown);
  display: grid; gap: var(--space-xs);
  padding: var(--space-sm); border-radius: var(--radius-lg); background: var(--color-paper-3);
  box-shadow: 0 -6px 24px oklch(10% 0.02 160 / 0.45);
  animation: sheet-in var(--dur-short) var(--ease-out);
}
.raise-head { display: flex; align-items: baseline; gap: var(--space-sm); flex-wrap: wrap; }
.raise-amount { font-size: var(--text-lg); font-weight: 700; }
.raise-note { margin-left: auto; font-size: var(--text-xs); color: var(--color-muted); }
.raise-presets { display: flex; gap: 4px; flex-wrap: wrap; }
.raise-presets .btn { flex: 1 1 3.5rem; min-height: 34px; font-size: var(--text-sm); padding: 0 6px; border-radius: var(--radius-sm); }
.raise-slider { width: 100%; accent-color: var(--color-accent); height: 32px; margin: 0; }
.raise-actions { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--space-xs); }
.raise-stepper { display: inline-flex; gap: 4px; }
.raise-stepper .btn { width: 44px; padding: 0; }

/* ---------- 浮层：抽屉、弹层、提示 ---------- */
.scrim { position: fixed; inset: 0; background: oklch(10% 0.02 160 / 0.6); z-index: var(--z-modal); display: flex; align-items: flex-end; justify-content: center; padding: 0; animation: fade var(--dur-short) var(--ease-out); }
.scrim.center { align-items: center; padding: var(--space-md); }
@keyframes fade { from { opacity: 0; } }
.sheet {
  width: 100%; max-width: 40rem; max-height: min(88vh, 88dvh); overflow-y: auto;
  background: var(--color-paper-2); border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  padding: var(--space-md) max(var(--space-md), env(safe-area-inset-left)) max(var(--space-lg), env(safe-area-inset-bottom)) max(var(--space-md), env(safe-area-inset-right));
  animation: sheet-in var(--dur-long) var(--ease-out);
  display: flex; flex-direction: column; gap: var(--space-md);
}
.scrim.center .sheet { border-radius: var(--radius-lg); padding-bottom: var(--space-md); animation: pop-in var(--dur-long) var(--ease-out); max-width: 32rem; }
@keyframes sheet-in { from { transform: translateY(24px); opacity: 0; } }
@keyframes pop-in { from { transform: scale(0.96); opacity: 0; } }
@media (min-width: 40rem) {
  .scrim { align-items: center; padding: var(--space-md); }
  .sheet { border-radius: var(--radius-lg); padding-bottom: var(--space-lg); }
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-sm); }
.sheet-head h2 { margin: 0; font-size: var(--text-md); font-weight: 700; }
.sheet h3 { margin: var(--space-sm) 0 var(--space-xs); font-size: var(--text-base); color: var(--color-accent); font-weight: 700; }
.sheet p { margin: 0 0 var(--space-xs); color: var(--color-muted); }
.sheet p strong { color: var(--color-ink); }
.sheet ul, .sheet ol { margin: 0 0 var(--space-sm); padding-left: 1.2em; color: var(--color-muted); }
.sheet li { margin-bottom: var(--space-2xs); }
.sheet li strong { color: var(--color-ink); }
.checklist { counter-reset: step; list-style: none; padding-left: 0 !important; display: grid; gap: var(--space-xs); }
.checklist li { position: relative; padding-left: 2rem; min-height: 1.6rem; }
.checklist li::before { counter-increment: step; content: counter(step); position: absolute; left: 0; top: 0.1rem; width: 1.4rem; height: 1.4rem; border-radius: 50%; background: var(--color-paper-4); color: var(--color-ink); font-family: var(--font-display); font-weight: 700; font-size: var(--text-xs); display: flex; align-items: center; justify-content: center; }
.diagram { display: flex; justify-content: center; margin: var(--space-xs) 0 var(--space-sm); }
.diagram svg { width: 100%; max-width: 440px; height: auto; }

/* 发牌员记录抽屉 */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(100%, 24rem); background: var(--color-paper-2); border-left: 1px solid var(--color-rule); z-index: var(--z-modal); display: flex; flex-direction: column; animation: drawer-in var(--dur-long) var(--ease-out); padding-top: env(safe-area-inset-top, 0px); }
@keyframes drawer-in { from { transform: translateX(24px); opacity: 0; } }
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding: var(--space-xs) var(--space-xs) var(--space-xs) var(--space-md); border-bottom: 1px solid var(--color-rule); }
.drawer-head h2 { margin: 0; font-size: var(--text-base); }
.log { flex: 1; overflow-y: auto; padding: var(--space-sm) var(--space-md) max(var(--space-md), env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 3px; font-size: var(--text-sm); }
.log-line { color: var(--color-muted); padding-left: 10px; position: relative; }
.log-line::before { content: ""; position: absolute; left: 0; top: 0.65em; width: 4px; height: 4px; border-radius: 50%; background: var(--color-neutral); }
.log-line.deal { color: var(--color-ink); }
.log-line.deal::before { background: var(--color-good); }
.log-line.pot { color: var(--color-accent); }
.log-line.pot::before { background: var(--color-accent); }
.log-line.end { color: var(--color-ink); font-weight: 700; margin-top: var(--space-xs); padding-left: 0; }
.log-line.end::before { display: none; }
.log-line.note::before { background: var(--color-warn); }

/* 结果层 */
.result { display: flex; flex-direction: column; gap: var(--space-sm); }
.result-title { font-size: var(--text-xl); font-weight: 800; margin: 0; line-height: 1.1; }
.result-title.win { color: var(--color-accent); }
.result-sub { color: var(--color-muted); margin: 0; }
.result-board { display: flex; gap: 4px; align-items: center; }
.result-board .card, .reveal .card { width: 34px; box-shadow: none; }
.result-board .card.best, .reveal .card.best { box-shadow: 0 0 0 2px var(--color-accent); }
.result-board-label { font-size: var(--text-xs); color: var(--color-muted); margin-right: 4px; }
.reveals { display: grid; gap: 4px; }
.reveal { display: grid; grid-template-columns: 5rem auto minmax(0, 1fr); align-items: center; gap: var(--space-sm); padding: 4px 8px; border-radius: var(--radius-md); font-size: var(--text-sm); }
.reveal.win { background: oklch(80% 0.13 85 / 0.12); }
.reveal-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reveal-cards { display: flex; gap: 3px; }
.reveal-hand { color: var(--color-muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reveal.win .reveal-hand { color: var(--color-ink); }
.result-lines { display: grid; gap: var(--space-2xs); font-size: var(--text-sm); }
.result-lines .row { display: flex; justify-content: space-between; gap: var(--space-sm); }
.result-lines .row span:last-child { font-weight: 700; }
.review { display: grid; gap: 2px; font-size: var(--text-sm); padding: var(--space-xs) var(--space-sm); border-radius: var(--radius-md); background: var(--color-paper-3); }
.review-title { font-weight: 700; }
.review-line { color: var(--color-muted); }
.review-line.diff::before { content: "· "; color: var(--color-warn); }
.result-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--space-sm); flex-wrap: wrap; }
.countdown { color: var(--color-muted); font-size: var(--text-sm); }
.achv-pop { display: flex; align-items: center; gap: var(--space-sm); padding: var(--space-xs) var(--space-sm); border: 1px solid var(--color-accent); border-radius: var(--radius-md); }
.achv-pop strong { color: var(--color-accent); }
.achv-pop small { color: var(--color-muted); display: block; }

/* 发牌员提问 */
.quiz-bar {
  position: absolute; left: 50%; bottom: var(--space-2xs); transform: translateX(-50%); z-index: var(--z-dropdown);
  width: min(92%, 30rem); background: var(--color-paper-2); border: 1px solid var(--color-accent); border-radius: var(--radius-lg);
  padding: var(--space-sm) var(--space-md); display: flex; flex-direction: column; gap: var(--space-xs); animation: pop-in var(--dur-short) var(--ease-out);
  box-shadow: 0 10px 30px oklch(8% 0.03 160 / 0.5);
}
.quiz-tag { font-size: var(--text-xs); font-weight: 700; color: var(--color-accent); letter-spacing: 0.06em; }
.quiz-prompt { margin: 0; font-weight: 600; }
.quiz-options { display: flex; flex-wrap: wrap; gap: var(--space-xs); }
.quiz-options .btn { flex: 1 1 auto; min-height: 38px; font-size: var(--text-sm); }
.quiz-feedback { margin: 0; font-size: var(--text-sm); color: var(--color-muted); }
.quiz-feedback.ok { color: var(--color-good); }
.quiz-feedback.bad { color: var(--color-bad); }
.seat.pick { cursor: pointer; }
.seat.pick .seat-box { border-style: dashed; border-color: var(--color-accent); }
.seat.pick:hover .seat-box { background: var(--color-paper-3); }
.quiz-foot { display: flex; justify-content: space-between; align-items: center; gap: var(--space-sm); font-size: var(--text-xs); color: var(--color-muted); }

/* 提示条 */
.toast-wrap { position: fixed; left: 50%; bottom: calc(var(--space-md) + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: var(--z-toast); display: flex; flex-direction: column; gap: var(--space-xs); align-items: center; pointer-events: none; width: min(92%, 26rem); }
.toast { background: var(--color-ink); color: var(--color-paper); padding: var(--space-xs) var(--space-md); border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: 600; animation: toast-in var(--dur-long) var(--ease-out); pointer-events: auto; text-align: center; }
.toast.gold { background: var(--color-accent); color: var(--color-accent-ink); }
@keyframes toast-in { from { transform: translateY(10px); opacity: 0; } }
.banner { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: var(--z-dropdown); padding: var(--space-xs) var(--space-md); border-radius: var(--radius-md); background: oklch(20% 0.04 160 / 0.9); color: var(--color-ink); font-size: var(--text-sm); white-space: nowrap; animation: fade var(--dur-short) var(--ease-out); pointer-events: none; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }

/* 规则速查 */
.rank-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
.rank-table td { padding: 6px 4px; border-bottom: 1px solid var(--color-rule); vertical-align: middle; }
.rank-table td:first-child { color: var(--color-ink); font-weight: 700; white-space: nowrap; }
.rank-table td:last-child { color: var(--color-muted); }
.mini-cards { display: flex; gap: 3px; }
.mini-cards .card { width: 24px; box-shadow: none; }
.mini-cards .card .suit-big { display: none; }
.mini-cards .card .rank { font-size: 46cqw; }
.mini-cards .card .suit-sm { font-size: 36cqw; }
.flow-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
.flow-table th, .flow-table td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--color-rule); vertical-align: top; }
.flow-table th { color: var(--color-ink); font-weight: 700; white-space: nowrap; }
.flow-table td { color: var(--color-muted); }
.faq dt { font-weight: 700; margin-top: var(--space-sm); }
.faq dd { margin: var(--space-2xs) 0 0; color: var(--color-muted); }
.tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs .btn { flex: none; }

/* 成就与统计 */
.achv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: var(--space-xs); }
.achv { padding: var(--space-sm); border-radius: var(--radius-md); background: var(--color-paper-3); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.achv.locked { opacity: 0.55; }
.achv strong { font-size: var(--text-sm); }
.achv small { color: var(--color-muted); font-size: var(--text-xs); line-height: 1.35; }
.achv .reward { color: var(--color-accent); font-weight: 700; font-size: var(--text-xs); margin-top: auto; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr)); gap: var(--space-sm); }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat small { color: var(--color-muted); font-size: var(--text-xs); }
.stat .num { font-size: var(--text-lg); font-weight: 700; }
.settings-list { display: flex; flex-direction: column; }
.settings-list .switch, .settings-list .setting-row { padding: var(--space-xs) 0; border-bottom: 1px solid var(--color-rule); }
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-sm); flex-wrap: wrap; min-height: 44px; }
.setting-row > span { display: flex; flex-direction: column; }
.setting-row small { color: var(--color-muted); font-size: var(--text-sm); }
.swatches { display: flex; gap: 6px; }
.swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; position: relative; }
.swatch[aria-pressed="true"] { border-color: var(--color-accent); }
.swatch:disabled { opacity: 0.35; cursor: not-allowed; }
.swatch.green { background: oklch(39% 0.085 160); }
.swatch.blue { background: oklch(40% 0.08 240); }
.swatch.red { background: oklch(40% 0.1 25); }
.swatch.purple { background: oklch(38% 0.09 300); }
.swatch.classic { background: repeating-linear-gradient(45deg, oklch(42% 0.1 25) 0 3px, oklch(30% 0.09 25) 3px 6px); }
.swatch.ocean { background: repeating-linear-gradient(45deg, oklch(45% 0.1 240) 0 3px, oklch(32% 0.09 240) 3px 6px); }
.swatch.forest { background: repeating-linear-gradient(45deg, oklch(45% 0.1 150) 0 3px, oklch(32% 0.09 150) 3px 6px); }
.danger-zone { display: flex; flex-direction: column; gap: var(--space-xs); padding-top: var(--space-sm); }
.danger-zone small { color: var(--color-muted); }

/* 飞行筹码 */
.fly { position: absolute; z-index: var(--z-dropdown); pointer-events: none; display: flex; align-items: center; gap: 4px; font-size: var(--text-sm); font-weight: 700; color: var(--color-accent); transform: translate(-50%, -50%); }

/* ---------- 宽屏调整 ---------- */
@media (min-width: 60rem) {
  .bottom { grid-template-columns: auto minmax(0, 1fr); max-width: 1100px; width: 100%; margin: 0 auto; border-top: 0; background: transparent; padding-bottom: max(var(--space-md), env(safe-area-inset-bottom)); }
  .actions { max-width: 36rem; }
  .raise-panel { left: auto; width: min(44rem, calc(100% - 2 * var(--space-md))); }
  .seat { width: 126px; }
  .flow-line { font-size: var(--text-base); }
  .flow-why { font-size: var(--text-sm); }
  .tracker li { font-size: 11px; }
}
@media (orientation: landscape) and (max-height: 500px) {
  .bottom { padding-block: 4px 6px; }
  .hero-cards .card { width: clamp(44px, 9vh, 72px); }
  .action .btn { min-height: 40px; }
  .action-hint { display: none; }
  .felt { inset: 30px 40px; }
}

/* ---------- 减少动态效果 ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 120ms !important; animation-iteration-count: 1 !important; transition-duration: 100ms !important; }
  .enter { animation: none; }
  .seat.active .ring .fill { animation: none; stroke-dashoffset: 0; }
}

</style>
</head>
<body>
<div id="app">

  <!-- ================= 大厅 ================= -->
  <main id="lobby" class="screen">
    <div class="lobby-inner">
      <header class="masthead enter" style="--i: 0">
        <div class="wordmark"><span class="wordmark-cn">德州陪练</span><span class="wordmark-en">Hold'em Coach</span></div>
        <button type="button" class="level-pill" id="level-pill" data-open="stats" title="查看统计">
          <span class="level-pill-no">Lv.<span class="num" id="level-no">1</span></span>
          <span id="level-title">新手</span>
        </button>
      </header>

      <section class="hero" aria-label="开始">
        <div class="hero-text enter" style="--i: 1">
          <h1 class="headline">一个人，<br>把德州的流程练熟。</h1>
          <p class="lede">每一步都告诉你轮到谁、为什么、能做什么。线下和朋友玩、轮到你发牌时，不再卡壳。</p>
        </div>
        <div class="stage enter" style="--i: 2" aria-hidden="true">
          <div class="stage-felt"></div>
          <div class="stage-cards" id="lobby-fan"></div>
          <div class="stage-chip stage-chip-a"></div>
          <div class="stage-chip stage-chip-b"></div>
          <div class="stage-btn">D</div>
        </div>
        <div class="hero-cta enter" style="--i: 3">
          <div class="bank-row">
            <div class="bank">
              <p class="bank-label">筹码余额</p>
              <p class="bank-amount num" id="bank-amount">10,000</p>
            </div>
            <p class="bank-last" id="bank-last" hidden></p>
          </div>
          <button type="button" class="btn btn-primary btn-xl" id="btn-start">坐下 · 买入 2,000</button>
          <button type="button" class="btn btn-outline btn-xl" id="btn-relief" hidden>领取救济金 2,000</button>
          <div class="table-setup" role="group" aria-label="牌桌设置">
            <div class="seg seg-sm" id="opp-seg" role="group" aria-label="对手人数">
              <span class="seg-label">对手</span>
              <button type="button" data-n="2">2</button>
              <button type="button" data-n="3">3</button>
              <button type="button" data-n="4">4</button>
              <button type="button" data-n="5" aria-pressed="true">5</button>
            </div>
            <button type="button" class="chip-toggle" role="switch" aria-checked="true" data-setting="coach" id="toggle-coach"><span class="dot"></span>教练模式</button>
            <button type="button" class="chip-toggle" role="switch" aria-checked="false" data-setting="dealer" id="toggle-dealer"><span class="dot"></span>发牌员模式</button>
          </div>
          <p class="start-note" id="start-note">盲注 10 / 20，无限注现金桌。离开牌桌时筹码结算回余额。</p>
        </div>
      </section>

      <section class="today enter" style="--i: 4" aria-label="今日">
        <div class="today-head">
          <h2>今日</h2>
          <span class="today-signin" id="today-signin"></span>
        </div>
        <ul class="missions" id="missions"></ul>
      </section>

      <section class="progress enter" style="--i: 5" aria-label="等级">
        <div class="level-row"><span>等级 <strong id="level-no-2">1</strong> · <strong id="level-title-2">新手</strong></span><span class="num" id="level-xp">0 / 100</span></div>
        <div class="bar"><span id="level-bar" style="transform: scaleX(0)"></span></div>
        <div class="level-row"><span id="level-next">升到下一级解锁蓝色桌布</span></div>
      </section>

      <nav class="lobby-links enter" style="--i: 6" aria-label="更多">
        <button type="button" class="btn btn-ghost" data-open="rules">规则速查</button>
        <button type="button" class="btn btn-ghost" data-open="achievements">成就</button>
        <button type="button" class="btn btn-ghost" data-open="stats">统计</button>
        <button type="button" class="btn btn-ghost" data-open="settings">设置</button>
      </nav>
    </div>
  </main>

  <!-- ================= 牌桌 ================= -->
  <main id="table" class="screen" hidden>
    <header class="topbar">
      <button type="button" class="btn-icon" id="btn-leave" aria-label="离开牌桌" title="离开牌桌">
        <svg class="icon" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <button type="button" class="flow" id="flow" aria-expanded="false" title="点开看这一轮的解释">
        <span class="flow-line"><span class="flow-street" id="flow-street">翻牌前</span><span class="flow-text" id="flow-text">准备开始</span></span>
        <span class="flow-why" id="flow-why"></span>
      </button>
      <div class="topbar-right">
        <button type="button" class="btn-icon" id="btn-log" aria-label="发牌员记录" title="发牌员记录">
          <svg class="icon" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg>
        </button>
        <button type="button" class="btn-icon" id="btn-settings-table" aria-label="设置" title="设置">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>
        </button>
      </div>
    </header>

    <section class="table-wrap" id="table-wrap" aria-label="牌桌">
      <div class="felt"></div>
      <div class="board-area">
        <ol class="tracker" id="tracker" aria-label="一手牌的阶段">
          <li data-street="preflop">翻牌前</li><li data-street="flop">翻牌</li><li data-street="turn">转牌</li><li data-street="river">河牌</li><li data-street="showdown">摊牌</li>
        </ol>
        <div class="pot" id="pot"><span id="pot-label">底池</span><span class="num" id="pot-amount">0</span></div>
        <div class="board" id="board"></div>
      </div>
      <div id="seats"></div>
      <div id="bets"></div>
      <div class="dealer-btn" id="dealer-btn" hidden>D</div>
      <div id="quiz-host"></div>
      <div id="banner-host"></div>
    </section>

    <section class="bottom" aria-label="你的手牌与动作">
      <div class="hero-cards" id="hero-cards"></div>
      <div class="hero-info">
        <div class="readout"><span class="readout-title" id="readout-title">—</span><span class="readout-sub" id="readout-sub"></span></div>
        <button type="button" class="coach-chip" id="coach-chip" hidden>
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 1 3.5 10.9V17h-7v-3.1A6 6 0 0 1 12 3zM9.5 20h5"/></svg>
          <span id="coach-chip-text">建议</span>
        </button>
      </div>
      <div class="actions" id="actions">
        <div class="action"><button type="button" class="btn btn-danger" id="act-fold">弃牌</button><div class="action-hint" id="hint-fold"></div></div>
        <div class="action"><button type="button" class="btn btn-primary" id="act-check-call">过牌</button><div class="action-hint" id="hint-check-call"></div></div>
        <div class="action"><button type="button" class="btn btn-outline" id="act-raise">加注</button><div class="action-hint" id="hint-raise"></div></div>
      </div>
      <div class="waiting-note" id="waiting-note" hidden>等待对手行动</div>
      <div class="raise-panel" id="raise-panel" hidden>
        <div class="raise-head"><span id="raise-verb">加注到</span><span class="raise-amount num" id="raise-amount">0</span><span class="raise-note" id="raise-note"></span></div>
        <div class="raise-presets" id="raise-presets">
          <button type="button" class="btn" data-preset="min">最小</button>
          <button type="button" class="btn" data-preset="half">½ 池</button>
          <button type="button" class="btn" data-preset="threeq">¾ 池</button>
          <button type="button" class="btn" data-preset="pot">1 池</button>
          <button type="button" class="btn" data-preset="allin">全下</button>
        </div>
        <input type="range" class="raise-slider" id="raise-slider" min="0" max="100" step="1" value="0" aria-label="加注金额">
        <div class="raise-actions">
          <div class="raise-stepper">
            <button type="button" class="btn" id="raise-minus" aria-label="减少">−</button>
            <button type="button" class="btn" id="raise-plus" aria-label="增加">+</button>
          </div>
          <button type="button" class="btn btn-primary" id="raise-confirm">确认</button>
          <button type="button" class="btn btn-ghost" id="raise-cancel">取消</button>
        </div>
      </div>
    </section>
  </main>

  <div id="overlay-host"></div>
  <div class="toast-wrap" id="toast-wrap"></div>

  <!-- ================= 规则速查（模板） ================= -->
  <template id="tpl-rules">
    <div class="sheet-head"><h2>规则速查</h2><button type="button" class="btn-icon" data-close aria-label="关闭"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="tabs" role="tablist">
      <button type="button" class="btn btn-sm" data-tab="dealer" aria-pressed="true">发牌员清单</button>
      <button type="button" class="btn btn-sm" data-tab="positions">位置图</button>
      <button type="button" class="btn btn-sm" data-tab="ranks">牌型大小</button>
      <button type="button" class="btn btn-sm" data-tab="flow">一手牌流程</button>
      <button type="button" class="btn btn-sm" data-tab="actions">动作与加注</button>
      <button type="button" class="btn btn-sm" data-tab="pots">全下与边池</button>
      <button type="button" class="btn btn-sm" data-tab="faq">常见卡壳</button>
    </div>
    <section data-panel="dealer">
      <p>轮到你发牌时照着走，一手牌十二步。</p>
      <ol class="checklist">
        <li><strong>移按钮</strong>：庄家按钮顺时针移到下一个有筹码的人。</li>
        <li><strong>收盲注</strong>：按钮左手第一位出小盲，第二位出大盲。只有两个人时，庄家自己出小盲。</li>
        <li><strong>发底牌</strong>：洗牌切牌，从小盲开始顺时针每人一张，发两轮。</li>
        <li><strong>翻牌前叫牌</strong>：从大盲左手第一位（枪口位）开始。大盲最后说话，没人加注时他可以过牌。</li>
        <li><strong>判断一轮结束</strong>：所有没弃牌、没全下的人都表过态，并且投入相等。有人加注，就再轮一圈。</li>
        <li><strong>收底池</strong>：把桌上的下注推到中间。有人全下且筹码不等，分出边池。</li>
        <li><strong>翻牌</strong>：烧一张，发三张。从庄家左手第一位还在局里的人开始叫牌。</li>
        <li><strong>转牌</strong>：烧一张，发一张。同样顺序叫牌。</li>
        <li><strong>河牌</strong>：烧一张，发一张。同样顺序叫牌。</li>
        <li><strong>摊牌</strong>：河牌有人下注，最后下注或加注的人先亮；没人下注，庄家左手第一位先亮。顺时针轮流，牌小的可以不亮。</li>
        <li><strong>分底池</strong>：先分主池，再分边池。两人一样大就平分，零头给庄家左手第一位赢家。中途所有人都弃牌，底池直接给最后一个人，他可以不亮牌。</li>
        <li><strong>收牌</strong>：把牌收齐，回到第一步。</li>
      </ol>
    </section>
    <section data-panel="positions" hidden>
      <p>六人桌的位置名称和行动顺序。箭头方向是顺时针，也就是发牌和叫牌的方向。</p>
      <div class="diagram" id="position-diagram"></div>
      <ul>
        <li><strong>翻牌前</strong>从枪口位开始，顺时针到大盲为止。</li>
        <li><strong>翻牌后</strong>每一轮从小盲开始（小盲弃了就从下一位），庄家永远最后。</li>
        <li><strong>人少时</strong>：五人桌没有中位；四人桌只有庄、小盲、大盲、枪口；三人桌只有庄、小盲、大盲，翻牌前庄家先说话；两人单挑庄家兼小盲。</li>
      </ul>
    </section>
    <section data-panel="ranks" hidden>
      <p>从大到小。两人牌型相同时比牌型里的点数，再比踢脚；花色不分大小。</p>
      <table class="rank-table"><tbody id="rank-rows"></tbody></table>
      <p style="margin-top:0.75rem">记法：先看有没有同花和顺子，再数相同点数的牌有几张。四张同点数最大，然后三张加一对，然后两对，一对。</p>
    </section>
    <section data-panel="flow" hidden>
      <table class="flow-table">
        <tbody>
          <tr><th>开局</th><td>庄家按钮顺时针移一位。按钮左手第一位出小盲，第二位出大盲。发牌从小盲开始，每人一张，发两轮。</td></tr>
          <tr><th>翻牌前</th><td>从大盲左手第一位（枪口位）开始行动。盲注已经算下注，所以其他人要跟到大盲的数额。大盲最后说话，没人加注时可以过牌。</td></tr>
          <tr><th>翻牌</th><td>烧一张，发三张公共牌。从庄家左手第一位还在局里的人开始，庄家最后行动。</td></tr>
          <tr><th>转牌</th><td>烧一张，发第四张公共牌。行动顺序同上。</td></tr>
          <tr><th>河牌</th><td>烧一张，发第五张公共牌。行动顺序同上。</td></tr>
          <tr><th>摊牌</th><td>河牌有人下注时，最后下注或加注的人先亮牌；没人下注时，庄家左手第一位先亮。然后顺时针依次亮牌，牌差的人可以不亮直接弃。</td></tr>
          <tr><th>一轮何时结束</th><td>所有还能行动的人都表过态，而且投入的筹码相等。有人加注，就要再轮一圈让每个人回应。</td></tr>
          <tr><th>单挑</th><td>两个人时庄家就是小盲，翻牌前庄家先行动，翻牌后大盲先行动。</td></tr>
        </tbody>
      </table>
    </section>
    <section data-panel="actions" hidden>
      <h3>五种动作</h3>
      <ul>
        <li><strong>过牌</strong>：不下注，把行动交给下一位。只有在这一轮还没有人下注时才可以。</li>
        <li><strong>下注</strong>：这一轮第一个放筹码的人叫下注。最少一个大盲。</li>
        <li><strong>跟注</strong>：补到和当前最高下注一样多。</li>
        <li><strong>加注</strong>：比当前下注更多。加上去的部分至少等于上一次加注的额度。</li>
        <li><strong>弃牌</strong>：放弃这手牌，已经放进去的筹码不退。没人下注时不需要弃牌，过牌就好。</li>
      </ul>
      <h3>最小加注怎么算</h3>
      <p>盲注 10 / 20。有人加注到 60，加的部分是 40。下一个人要再加注，至少要加到 60 + 40 = 100。再有人加注到 200（加了 100），后面的人就至少要到 300。</p>
      <p>没人下注时，最小下注是一个大盲（20）。</p>
      <h3>说话的规矩</h3>
      <p>先说数额再放筹码，或者一次放够。只放一部分筹码又不说话，按规则只算跟注。线下常见的争议就在这里。</p>
    </section>
    <section data-panel="pots" hidden>
      <h3>全下</h3>
      <p>筹码不够跟注时可以全下，剩下的人继续在你够不到的部分里下注。全下的人之后不再行动，等摊牌。</p>
      <h3>不足额的全下</h3>
      <p>有人全下，但加的部分不到一个完整加注。已经行动过的人只能跟注这部分差额或弃牌，不能再加注；还没行动过的人照常可以加注。</p>
      <h3>边池</h3>
      <p>甲 100 全下，乙 300 全下，丙跟 300。主池是每人 100 共 300，三个人比。边池是乙和丙各多出的 200 共 400，只有乙丙两人比。甲就算牌最大，也只能赢主池。</p>
      <h3>平分底池</h3>
      <p>两人牌一样大就平分。分不尽的零头给庄家左手第一位赢家。</p>
      <h3>没人跟注</h3>
      <p>你下注 100，其他人都弃牌。超出别人投入的部分退回给你，剩下的底池归你，你不用亮牌。</p>
    </section>
    <section data-panel="faq" hidden>
      <dl class="faq">
        <dt>翻牌后到底谁先说话？</dt><dd>庄家左手第一位还在局里的人。弃牌的跳过，全下的也跳过。庄家永远最后一个。</dd>
        <dt>大盲为什么还可以行动？</dt><dd>盲注是被迫放的，不算表过态。轮到大盲时，如果没人加注，他可以过牌或加注；有人加注就要回应。</dd>
        <dt>什么时候这一轮才算完？</dt><dd>两个条件同时满足：每个还能行动的人都表过态，所有人投入相等。有人加注后，前面的人都要再回应一次。</dd>
        <dt>有人全下了，剩下的人还能继续下注吗？</dt><dd>能，只要还有两个人没全下。多出来的筹码进边池，全下的人不参与边池。</dd>
        <dt>两人单挑谁是小盲？</dt><dd>庄家是小盲。翻牌前庄家先行动，翻牌后大盲先行动。</dd>
        <dt>发牌员什么时候烧牌？</dt><dd>每次发公共牌之前烧一张：翻牌前烧一张发三张，转牌前烧一张发一张，河牌前烧一张发一张。</dd>
        <dt>摊牌时谁先亮？</dt><dd>河牌有人下注，最后下注或加注的人先亮。没人下注，庄家左手第一位先亮。</dd>
        <dt>我能用一张底牌吗？能一张都不用吗？</dt><dd>都可以。最佳五张可以来自两张底牌加三张公共牌、一张加四张，或者五张全是公共牌。</dd>
        <dt>有人说"加注"却只放了跟注的筹码怎么办？</dt><dd>线下以口头宣布为准，他必须补足到最小加注。所以当发牌员要先问清楚数额再收筹码。</dd>
      </dl>
    </section>
  </template>

    <div class="sheet-head"><h2>成就</h2><button type="button" class="btn-icon" data-close aria-label="关闭"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>

  <template id="tpl-stats">
    <div class="sheet-head"><h2>统计</h2><button type="button" class="btn-icon" data-close aria-label="关闭"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="stat-grid" id="stat-grid"></div>
  </template>

  <template id="tpl-settings">
    <div class="sheet-head"><h2>设置</h2><button type="button" class="btn-icon" data-close aria-label="关闭"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="settings-list" id="settings-list"></div>
    <div class="danger-zone">
      <button type="button" class="btn btn-danger" id="btn-reset">清空全部数据</button>
      <small>删除余额、成就和统计，回到初始状态。</small>
    </div>
  </template>

</div>
<script>
/* 德州陪练 · 规则引擎（无 DOM）
 * 牌用两字符字符串表示：点数 2-9 T J Q K A，花色 s h d c，例如 'As' 'Td'。
 * 引擎只产生结构化事件，不包含任何界面文案。
 */
(function (root) {
  'use strict';

  const RANK_CHARS = '23456789TJQKA';
  const SUITS = ['s', 'h', 'd', 'c'];

  function rankOf(card) { return RANK_CHARS.indexOf(card[0]) + 2; }
  function suitOf(card) { return card[1]; }
  function makeCard(rank, suit) { return RANK_CHARS[rank - 2] + suit; }

  function freshDeck() {
    const deck = [];
    for (const s of SUITS) for (let r = 2; r <= 14; r++) deck.push(makeCard(r, s));
    return deck;
  }

  function shuffle(deck, rng) {
    const a = deck.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ---------- 牌型评估 ---------- */

  const CAT = {
    HIGH: 0, PAIR: 1, TWO_PAIR: 2, TRIPS: 3, STRAIGHT: 4,
    FLUSH: 5, FULL_HOUSE: 6, QUADS: 7, STRAIGHT_FLUSH: 8,
  };

  const CAT_NAMES = ['高牌', '一对', '两对', '三条', '顺子', '同花', '葫芦', '四条', '同花顺'];

  function encode(cat, ranks) {
    let score = cat;
    for (let i = 0; i < 5; i++) score = score * 15 + (ranks[i] || 0);
    return score;
  }

  function evaluate5(cards) {
    const ranks = cards.map(rankOf).sort((a, b) => b - a);
    const flush = cards.every(c => c[1] === cards[0][1]);
    const counts = new Map();
    for (const r of ranks) counts.set(r, (counts.get(r) || 0) + 1);
    const groups = [...counts.entries()].sort((a, b) => b[1] - a[1] || b[0] - a[0]);

    let straightHigh = 0;
    if (groups.length === 5) {
      if (ranks[0] - ranks[4] === 4) straightHigh = ranks[0];
      else if (ranks[0] === 14 && ranks[1] === 5 && ranks[4] === 2) straightHigh = 5;
    }

    let cat, tie;
    if (straightHigh && flush) { cat = CAT.STRAIGHT_FLUSH; tie = [straightHigh]; }
    else if (groups[0][1] === 4) { cat = CAT.QUADS; tie = [groups[0][0], groups[1][0]]; }
    else if (groups[0][1] === 3 && groups[1][1] === 2) { cat = CAT.FULL_HOUSE; tie = [groups[0][0], groups[1][0]]; }
    else if (flush) { cat = CAT.FLUSH; tie = ranks; }
    else if (straightHigh) { cat = CAT.STRAIGHT; tie = [straightHigh]; }
    else if (groups[0][1] === 3) { cat = CAT.TRIPS; tie = [groups[0][0], groups[1][0], groups[2][0]]; }
    else if (groups[0][1] === 2 && groups[1][1] === 2) { cat = CAT.TWO_PAIR; tie = [groups[0][0], groups[1][0], groups[2][0]]; }
    else if (groups[0][1] === 2) { cat = CAT.PAIR; tie = [groups[0][0], groups[1][0], groups[2][0], groups[3][0]]; }
    else { cat = CAT.HIGH; tie = ranks; }

    return { cat, tie, score: encode(cat, tie), cards: cards.slice() };
  }

  function combos5(cards) {
    const n = cards.length, out = [];
    for (let a = 0; a < n - 4; a++)
      for (let b = a + 1; b < n - 3; b++)
        for (let c = b + 1; c < n - 2; c++)
          for (let d = c + 1; d < n - 1; d++)
            for (let e = d + 1; e < n; e++)
              out.push([cards[a], cards[b], cards[c], cards[d], cards[e]]);
    return out;
  }

  /* 评估 5 到 7 张牌，返回最佳五张及其牌型 */
  function evaluate(cards) {
    if (cards.length < 5) return null;
    if (cards.length === 5) return finish(evaluate5(cards));
    let best = null;
    for (const combo of combos5(cards)) {
      const r = evaluate5(combo);
      if (!best || r.score > best.score) best = r;
    }
    return finish(best);
  }

  function rankLabel(r) {
    if (r === 14) return 'A';
    if (r === 13) return 'K';
    if (r === 12) return 'Q';
    if (r === 11) return 'J';
    return String(r);
  }

  function finish(r) {
    r.name = CAT_NAMES[r.cat];
    r.royal = r.cat === CAT.STRAIGHT_FLUSH && r.tie[0] === 14;
    if (r.royal) r.name = '皇家同花顺';
    r.label = describe(r);
    return r;
  }

  function describe(r) {
    const t = r.tie;
    switch (r.cat) {
      case CAT.HIGH: return '高牌 ' + rankLabel(t[0]);
      case CAT.PAIR: return '一对 ' + rankLabel(t[0]);
      case CAT.TWO_PAIR: return '两对 ' + rankLabel(t[0]) + ' 和 ' + rankLabel(t[1]);
      case CAT.TRIPS: return '三条 ' + rankLabel(t[0]);
      case CAT.STRAIGHT: return '顺子 ' + rankLabel(t[0] === 5 ? 14 : t[0] - 4) + ' 到 ' + rankLabel(t[0]);
      case CAT.FLUSH: return rankLabel(t[0]) + ' 高同花';
      case CAT.FULL_HOUSE: return '葫芦 ' + rankLabel(t[0]) + ' 带 ' + rankLabel(t[1]);
      case CAT.QUADS: return '四条 ' + rankLabel(t[0]);
      case CAT.STRAIGHT_FLUSH:
        if (r.royal) return '皇家同花顺';
        return '同花顺 ' + rankLabel(t[0] === 5 ? 14 : t[0] - 4) + ' 到 ' + rankLabel(t[0]);
    }
    return '';
  }

  /* ---------- 一手牌状态机 ---------- */

  const STREETS = ['preflop', 'flop', 'turn', 'river'];

  class Game {
    constructor(opts) {
      this.sb = opts.blinds.sb;
      this.bb = opts.blinds.bb;
      this.rng = opts.rng || Math.random;
      this.players = opts.players.map((p, i) => ({
        seat: i,
        id: p.id != null ? p.id : i,
        name: p.name || ('座位' + (i + 1)),
        chips: p.chips,
        isHuman: !!p.isHuman,
        style: p.style || null,
        cards: [], bet: 0, total: 0,
        folded: false, allIn: false, out: p.chips <= 0,
        acted: false, actedAtRaise: -1,
        lastAction: null,
      }));
      this.button = opts.button == null ? -1 : opts.button;
      this.handNo = 0;
      this.phase = 'idle';
      this.street = null;
      this.board = [];
      this.deck = [];
      this.toAct = -1;
      this.currentBet = 0;
      this.minRaise = this.bb;
      this.raiseCount = 0;
      this.lastAggressor = -1;
      this.riverAggressor = -1;
      this.preflopAggressor = -1;
      this.pending = null;
      this.result = null;
      this.sbSeat = -1;
      this.bbSeat = -1;
    }

    /* ----- 工具 ----- */

    seated() { return this.players.filter(p => !p.out); }
    nextSeat(from, pred) {
      const n = this.players.length;
      for (let k = 1; k <= n; k++) {
        const p = this.players[(from + k) % n];
        if (pred(p)) return p.seat;
      }
      return -1;
    }
    inHand(p) { return !p.out && !p.folded; }
    canAct(p) { return this.inHand(p) && !p.allIn; }
    needsToAct(p) { return this.canAct(p) && (!p.acted || p.bet < this.currentBet); }
    potTotal() { return this.players.reduce((s, p) => s + p.total, 0); }
    potCollected() { return this.players.reduce((s, p) => s + p.total - p.bet, 0); }
    headsUp() { return this.seated().length === 2; }

    positions() {
      const labels = {};
      const seatedN = this.seated().length;
      if (seatedN < 2 || this.button < 0) return labels;
      const order = [];
      let s = this.button;
      for (let k = 0; k < seatedN; k++) {
        order.push(s);
        s = this.nextSeat(s, p => !p.out);
      }
      if (seatedN === 2) {
        labels[order[0]] = 'BTN/SB';
        labels[order[1]] = 'BB';
        return labels;
      }
      const names = { 3: ['BTN', 'SB', 'BB'], 4: ['BTN', 'SB', 'BB', 'UTG'], 5: ['BTN', 'SB', 'BB', 'UTG', 'CO'], 6: ['BTN', 'SB', 'BB', 'UTG', 'HJ', 'CO'] };
      const list = names[seatedN] || ['BTN', 'SB', 'BB', 'UTG', 'UTG+1', 'MP', 'HJ', 'CO', 'CO-1'].slice(0, seatedN);
      order.forEach((seat, i) => { labels[seat] = list[i]; });
      return labels;
    }

    /* ----- 开始一手 ----- */

    startHand(options) {
      options = options || {};
      const events = [];
      for (const p of this.players) {
        p.out = p.chips <= 0;
        p.cards = []; p.bet = 0; p.total = 0;
        p.folded = false; p.allIn = false; p.acted = false; p.actedAtRaise = -1;
        p.lastAction = null; p.revealed = false; p.hand = null;
      }
      const seated = this.seated();
      if (seated.length < 2) {
        this.phase = 'idle';
        events.push({ type: 'need-players' });
        return events;
      }
      this.handNo++;
      this.board = [];
      this.street = 'preflop';
      this.pending = null;
      this.result = null;
      this.raiseCount = 0;
      this.lastAggressor = -1;
      this.riverAggressor = -1;
      this.preflopAggressor = -1;

      // 庄家按钮移到下一位有筹码的玩家
      if (this.button < 0) {
        this.button = options.button != null ? options.button : seated[Math.floor(this.rng() * seated.length)].seat;
      } else {
        this.button = this.nextSeat(this.button, p => !p.out);
      }
      events.push({ type: 'hand-start', handNo: this.handNo, button: this.button, positions: this.positions() });

      // 盲注
      if (seated.length === 2) {
        this.sbSeat = this.button;
        this.bbSeat = this.nextSeat(this.button, p => !p.out);
      } else {
        this.sbSeat = this.nextSeat(this.button, p => !p.out);
        this.bbSeat = this.nextSeat(this.sbSeat, p => !p.out);
      }
      events.push(this.postBlind(this.sbSeat, 'sb', this.sb));
      events.push(this.postBlind(this.bbSeat, 'bb', this.bb));
      this.currentBet = this.bb;
      this.minRaise = this.bb;

      // 发底牌：从庄家左手第一位开始，每人一张，发两轮
      this.deck = options.deck ? options.deck.slice() : shuffle(freshDeck(), this.rng);
      const order = [];
      let s = this.nextSeat(this.button, p => !p.out);
      for (let k = 0; k < seated.length; k++) { order.push(s); s = this.nextSeat(s, p => !p.out); }
      for (let round = 0; round < 2; round++) {
        for (const seat of order) this.players[seat].cards.push(this.deck.pop());
      }
      events.push({ type: 'deal-hole', order });

      // 翻牌前第一个行动的人
      const first = this.firstToAct('preflop');
      if (first < 0 || this.players.filter(p => this.canAct(p)).length < 2) {
        // 盲注就把人全下了，没有下注轮
        events.push({ type: 'street', street: 'preflop', first: -1, skipped: true });
        events.push(...this.closeRound());
      } else {
        this.phase = 'betting';
        this.toAct = first;
        events.push({ type: 'street', street: 'preflop', first });
        events.push({ type: 'turn', seat: first });
      }
      return events;
    }

    postBlind(seat, kind, amount) {
      const p = this.players[seat];
      const paid = Math.min(amount, p.chips);
      p.chips -= paid; p.bet = paid; p.total = paid;
      if (p.chips === 0) p.allIn = true;
      p.lastAction = { type: kind, amount: paid };
      return { type: 'blind', seat, kind, amount: paid, allIn: p.allIn, short: paid < amount };
    }

    /* 某条街第一个行动的座位（不改变状态） */
    firstToAct(street) {
      if (street === 'preflop') {
        if (this.headsUp()) {
          return this.canAct(this.players[this.button]) ? this.button : this.nextSeat(this.button, p => this.canAct(p));
        }
        return this.nextSeat(this.bbSeat, p => this.canAct(p));
      }
      return this.nextSeat(this.button, p => this.canAct(p));
    }

    /* ----- 合法动作 ----- */

    legalActions(seat) {
      if (this.phase !== 'betting' || seat !== this.toAct) return null;
      const p = this.players[seat];
      const toCall = Math.min(this.currentBet - p.bet, p.chips);
      const maxTo = p.bet + p.chips;
      const canRaise = p.chips > toCall && p.actedAtRaise !== this.raiseCount;
      let raise = null;
      if (canRaise) {
        const min = Math.min(this.currentBet + this.minRaise, maxTo);
        raise = { min, max: maxTo };
      }
      return {
        fold: true,
        check: toCall === 0,
        call: toCall > 0 ? toCall : 0,
        callIsAllIn: toCall > 0 && toCall >= p.chips,
        raise,
        allIn: maxTo,
        toCall,
        pot: this.potTotal(),
      };
    }

    /* ----- 执行动作 ----- */

    act(seat, action) {
      const legal = this.legalActions(seat);
      if (!legal) throw new Error('不是该座位行动的时候');
      const p = this.players[seat];
      const events = [];
      let type = action.type;
      let amount = action.amount;

      if (type === 'allin') {
        amount = p.bet + p.chips;
        type = amount > this.currentBet ? 'raise' : 'call';
        if (type === 'call' && legal.toCall === 0) type = 'check';
      }

      if (type === 'fold') {
        p.folded = true; p.acted = true;
        p.lastAction = { type: 'fold' };
        events.push({ type: 'action', seat, action: 'fold' });
      } else if (type === 'check') {
        if (!legal.check) throw new Error('有人下注时不能过牌');
        p.acted = true; p.actedAtRaise = this.raiseCount;
        p.lastAction = { type: 'check' };
        events.push({ type: 'action', seat, action: 'check' });
      } else if (type === 'call') {
        if (!legal.call) throw new Error('没有需要跟注的金额');
        const paid = legal.toCall;
        p.chips -= paid; p.bet += paid; p.total += paid;
        if (p.chips === 0) p.allIn = true;
        p.acted = true; p.actedAtRaise = this.raiseCount;
        p.lastAction = { type: 'call', amount: paid, allIn: p.allIn };
        events.push({ type: 'action', seat, action: 'call', amount: paid, to: p.bet, allIn: p.allIn });
      } else if (type === 'raise') {
        if (!legal.raise) throw new Error('现在不能加注');
        if (amount == null) amount = legal.raise.min;
        amount = Math.round(amount);
        if (amount > legal.raise.max) amount = legal.raise.max;
        if (amount < legal.raise.min && amount !== legal.raise.max) throw new Error('加注额低于最小加注');
        const wasBet = this.currentBet === 0;
        const raiseSize = amount - this.currentBet;
        const full = raiseSize >= this.minRaise;
        const paid = amount - p.bet;
        p.chips -= paid; p.bet = amount; p.total += paid;
        if (p.chips === 0) p.allIn = true;
        this.currentBet = amount;
        if (full) { this.minRaise = raiseSize; this.raiseCount++; }
        this.lastAggressor = seat;
        if (this.street === 'river') this.riverAggressor = seat;
        if (this.street === 'preflop') this.preflopAggressor = seat;
        p.acted = true; p.actedAtRaise = this.raiseCount;
        const label = wasBet ? 'bet' : 'raise';
        p.lastAction = { type: label, amount, allIn: p.allIn };
        events.push({ type: 'action', seat, action: label, amount: paid, to: amount, raiseSize, full, allIn: p.allIn });
      } else {
        throw new Error('未知动作 ' + type);
      }

      events.push(...this.afterAction(seat));
      return events;
    }

    afterAction(seat) {
      const events = [];
      const inHand = this.players.filter(p => this.inHand(p));
      if (inHand.length === 1) {
        this.phase = 'between';
        this.toAct = -1;
        for (const p of this.players) p.bet = 0;
        this.currentBet = 0;
        this.pending = { kind: 'award-uncontested', seat: inHand[0].seat };
        events.push({ type: 'round-end', street: this.street, pot: this.potTotal(), uncontested: true });
        return events;
      }
      const next = this.nextSeat(seat, p => this.needsToAct(p));
      if (next >= 0) {
        this.toAct = next;
        events.push({ type: 'turn', seat: next });
        return events;
      }
      events.push(...this.closeRound());
      return events;
    }

    /* 一轮下注结束：收筹码进底池，决定下一步 */
    closeRound() {
      const events = [];
      this.toAct = -1;
      this.phase = 'between';
      for (const p of this.players) p.bet = 0;
      this.currentBet = 0;
      events.push({ type: 'round-end', street: this.street, pot: this.potTotal() });

      const inHand = this.players.filter(p => this.inHand(p));
      const able = inHand.filter(p => !p.allIn);
      if (this.street === 'river') {
        this.pending = { kind: 'showdown' };
      } else {
        const idx = STREETS.indexOf(this.street);
        this.pending = { kind: 'deal-' + STREETS[idx + 1], street: STREETS[idx + 1] };
        if (able.length < 2 && inHand.length >= 2) {
          events.push({ type: 'all-in-showdown', seats: inHand.map(p => p.seat) });
        }
      }
      return events;
    }

    /* 下一步是什么（供发牌员模式提问，不改变状态） */
    nextStep() {
      if (this.phase === 'betting') {
        return { kind: 'betting', street: this.street, seat: this.toAct };
      }
      if (!this.pending) return null;
      const step = Object.assign({}, this.pending);
      if (step.kind.startsWith('deal-')) {
        const able = this.players.filter(p => this.canAct(p));
        step.first = able.length >= 2 ? this.nextSeat(this.button, p => this.canAct(p)) : -1;
      }
      return step;
    }

    /* 执行下一步 */
    advance() {
      if (this.phase !== 'between' || !this.pending) return [];
      const step = this.pending;
      this.pending = null;
      if (step.kind === 'award-uncontested') return this.awardUncontested(step.seat);
      if (step.kind === 'showdown') return this.showdown();
      return this.dealStreet(step.street);
    }

    dealStreet(street) {
      const events = [];
      this.street = street;
      const count = street === 'flop' ? 3 : 1;
      this.deck.pop(); // 烧牌
      const cards = [];
      for (let i = 0; i < count; i++) cards.push(this.deck.pop());
      this.board.push(...cards);
      events.push({ type: 'deal-board', street, cards, board: this.board.slice() });

  /* ---------- 座位布局 ---------- */
  function buildSeats() {

      const seat = el('div', { class: 'seat' + (i === HERO ? ' hero' : ''), 'data-seat': i }, [

  function seatGeometry(i) {
    const n = session ? session.game.players.length : 1;
    const rect = tableWrap.getBoundingClientRect();
    const felt = $('.felt', tableWrap).getBoundingClientRect();
    const theta = (Math.PI / 2) + i * (2 * Math.PI / n);
    return { cx: rect.width / 2, cy: rect.height / 2, rx: felt.width / 2, ry: felt.height / 2, cos: Math.cos(theta), sin: Math.sin(theta) };
  }
  function layoutSeats() {
    if (!session || tableScreen.hidden) return;
    session.game.players.forEach((p, i) => {
      const g = seatGeometry(i);
      const seat = seatEls[i];
      seat.style.left = (g.cx + g.rx * g.cos) + 'px';
      seat.style.top = (g.cy + g.ry * g.sin) + 'px';
      seat.style.flexDirection = g.sin < -0.2 ? 'column-reverse' : 'column';
      const bet = betEls[i];
      bet.style.left = (g.cx + g.rx * 0.6 * g.cos) + 'px';
      bet.style.top = (g.cy + g.ry * 0.62 * g.sin) + 'px';
    });

  }
  function placeDealerButton() {
    const g = session.game, btn = $('#dealer-btn');
    if (g.button < 0) { btn.hidden = true; return; }
    const geo = seatGeometry(g.button);
    const theta = (Math.PI / 2) + g.button * (2 * Math.PI / g.players.length) + 0.42;
    btn.hidden = false;
    btn.style.left = (geo.cx + geo.rx * 0.8 * Math.cos(theta)) + 'px';
    btn.style.top = (geo.cy + geo.ry * 0.78 * Math.sin(theta)) + 'px';
  }
  new ResizeObserver(() => layoutSeats()).observe(tableWrap);

  /* ---------- 渲染 ---------- */
  function renderAll() {
    if (!session) return;
    renderSeats();
    renderBets();
    renderBoard();
    renderPot();
    renderHero();
    renderFlow();
    renderActions();
    placeDealerButton();
  }
  function actionLabel(a) {
    if (!a) return '';
    switch (a.type) {
      case 'sb': return '小盲 ' + fmt(a.amount);
      case 'bb': return '大盲 ' + fmt(a.amount);
      case 'fold': return '弃牌';
      case 'check': return '过牌';
      case 'call': return '跟注 ' + fmt(a.amount);
      case 'bet': return '下注 ' + fmt(a.amount);
      case 'raise': return '加注到 ' + fmt(a.amount);
    }
    return '';
  }
  function seatStatus(p) {
    const g = session.game;
    if (p.out) return ['', ''];
    if (p.folded) return ['弃牌', 'fold'];
    const last = actionLabel(p.lastAction);
    if (p.allIn) return ['全下', 'allin'];
    if (g.phase === 'betting') {
      if (g.toAct === p.seat) {
        if (session.quizPending && session.quizHide) return ['', ''];
        if (p.seat !== HERO) return ['思考中', 'act'];
        if (session.heroDeadline) { const left = Math.max(0, Math.ceil((session.heroDeadline - Date.now()) / 1000)); return [left > 0 ? '轮到你 · ' + left + ' 秒' : '轮到你 · 时间到', 'act']; }
        return ['轮到你', 'act'];
      }
      if (p.bet < g.currentBet) return profile.settings.coach ? ['还差 ' + fmt(g.currentBet - p.bet), 'need'] : [last, ''];
      if (p.acted) return ['✓ ' + (last || '已跟平'), 'ok'];
      return profile.settings.coach ? ['待表态', 'need'] : [last, ''];
    }
    return [last, p.lastAction && (p.lastAction.type === 'raise' || p.lastAction.type === 'bet') ? 'act' : ''];
  }
  function renderSeats() {
    const g = session.game;
    const pos = g.positions();
    g.players.forEach((p, i) => {
      const seat = seatEls[i];
      seat.classList.toggle('folded', p.folded);

      $('.seat-chips', seat).textContent = p.chips === 0 && !p.out ? '全下' : fmt(p.chips);
      const posEl = $('.seat-pos', seat);
      let label = pos[i];

      const [text, cls] = session.hideBets ? ['', ''] : seatStatus(p);

      if (cardsEl.dataset.key !== key) {
